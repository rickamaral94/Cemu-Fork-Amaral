name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/dependencies/vcpkg
  VCPKG_BINARY_SOURCES: clear;nuget,GitHub,read
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  test-build-verify:
    name: Test, build and verify arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            src/android/*.gradle.kts
            src/android/**/*.gradle.kts
            src/android/gradle/libs.versions.toml
            src/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext mono-complete

      - name: Prepare translations
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for mo_file in bin/resources/*/cemu.mo
          do
            language_code=$(basename "$(dirname "$mo_file")")
            po_file="src/android/app/src/main/assets/translations/$language_code/cemu.po"
            mkdir -p "$(dirname "$po_file")"
            msgunfmt "$mo_file" -o "$po_file"
          done

      - name: Enable vcpkg cache writes
        if: github.event_name != 'pull_request'
        run: echo 'VCPKG_BINARY_SOURCES=clear;nuget,GitHub,readwrite' >> "$GITHUB_ENV"

      - name: Set up vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests and build release APK
        working-directory: src/android
        run: ./gradlew --no-daemon test assembleRelease --stacktrace

      - name: Verify release APK
        env:
          EXPECTED_APPLICATION_ID: io.github.rickamaral94.cemu
          VERIFY_APK_SIGNATURE: "1"
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src/android/app/build/outputs/apk/release -type f -name '*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          tools/android/verify-apk.sh "${apks[0]}"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: cemu-fork-amaral-arm64-${{ github.sha }}
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
