name: Bootstrap Android fork

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-import.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_BASE_SHA: 7c2324eda01a3974ff89aa1e4ee7a594d278662a
  UPSTREAM_SHA: cee557d46d63e3407dc3bbda6480c0c674e8bb80

jobs:
  import-build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout bootstrap files
        uses: actions/checkout@v6
        with:
          path: bootstrap

      - name: Reconstruct audited history
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout https://github.com/SSimco/Cemu.git imported
          cd imported
          git fetch origin "$ANDROID_BASE_SHA"
          git checkout --detach "$ANDROID_BASE_SHA"
          git switch -c imported-main
          git config user.name "Codex"
          git config user.email "codex@openai.com"

          git am "$GITHUB_WORKSPACE/bootstrap/.bootstrap/0001-baseline.patch"
          git am "$GITHUB_WORKSPACE/bootstrap/.bootstrap/0002-package-security.patch"
          git am "$GITHUB_WORKSPACE/bootstrap/.bootstrap/0003-android-ci.patch"

          git remote add cemu-upstream https://github.com/cemu-project/Cemu.git
          git fetch --filter=blob:none cemu-upstream "$UPSTREAM_SHA"

          set +e
          git merge --no-commit --no-ff "$UPSTREAM_SHA"
          merge_status=$?
          set -e

          if [[ $merge_status -eq 0 ]]; then
            echo "Expected the audited swkbd conflict, but merge completed cleanly" >&2
            exit 1
          fi

          mapfile -t unmerged_files < <(git diff --name-only --diff-filter=U)
          if [[ ${#unmerged_files[@]} -ne 1 || "${unmerged_files[0]}" != "src/Cafe/OS/libs/swkbd/swkbd.cpp" ]]; then
            echo "Unexpected merge conflicts: ${unmerged_files[*]}" >&2
            exit 1
          fi

          git checkout --theirs -- src/Cafe/OS/libs/swkbd/swkbd.cpp
          git apply "$GITHUB_WORKSPACE/bootstrap/.bootstrap/swkbd-android.patch"
          mkdir -p docs/android/sync
          cp "$GITHUB_WORKSPACE/bootstrap/.bootstrap/upstream-sync.md" docs/android/sync/2026-09-08.md
          git add src/Cafe/OS/libs/swkbd/swkbd.cpp docs/android/sync/2026-09-08.md

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge paths remain" >&2
            exit 1
          fi

          git diff --check
          git commit -m "merge: synchronize Cemu upstream 2026-09-08"
          git am "$GITHUB_WORKSPACE/bootstrap/.bootstrap/0004-ci-test-task.patch"
          git am "$GITHUB_WORKSPACE/bootstrap/.bootstrap/0005-existing-file-test.patch"
          git am "$GITHUB_WORKSPACE/bootstrap/.bootstrap/0006-arm64-packaging.patch"

          # The workflow token cannot add or replace workflow files. Keep this
          # already-authorized bootstrap workflow byte-for-byte identical while
          # importing the source tree; the regular CI workflow is installed in
          # a separate authenticated change after bootstrap completes.
          find .github/workflows -mindepth 1 -maxdepth 1 -type f -delete
          cp "$GITHUB_WORKSPACE/bootstrap/.github/workflows/bootstrap-import.yml" .github/workflows/bootstrap-import.yml
          git add -A .github/workflows
          git commit -m "ci: retain authorized bootstrap workflow during import"

          git merge-base --is-ancestor "$ANDROID_BASE_SHA" HEAD
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          test -f src/android/app/build.gradle.kts
          test -x tools/android/verify-apk.sh

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext mono-complete

      - name: Initialize native dependencies
        working-directory: imported
        run: git submodule update --init --recursive

      - name: Prepare translations
        working-directory: imported
        shell: bash
        run: |
          set -euo pipefail
          for mo_file in bin/resources/*/cemu.mo
          do
            language_code=$(basename "$(dirname "$mo_file")")
            po_file="src/android/app/src/main/assets/translations/$language_code/cemu.po"
            mkdir -p "$(dirname "$po_file")"
            msgunfmt "$mo_file" -o "$po_file"
          done

      - name: Test and build Android release
        working-directory: imported/src/android
        run: ./gradlew test assembleRelease --stacktrace

      - name: Verify release APK
        working-directory: imported
        shell: bash
        run: |
          mapfile -t apks < <(find ./src/android/app/build/outputs/apk/release -type f -name '*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          ./tools/android/verify-apk.sh "${apks[0]}"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: cemu-fork-amaral-bootstrap-arm64
          path: imported/src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish reconstructed main
        working-directory: imported
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force target HEAD:refs/heads/main
